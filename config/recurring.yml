# Recurring production maintenance jobs.

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  expire_team_entitlements:
    class: ExpireTeamEntitlementsJob
    queue: default
    schedule: every 15 minutes

  schedule_automatic_payment_reminders:
    class: ScheduleAutomaticPaymentRemindersJob
    queue: default
    schedule: every hour at minute 25

  schedule_team_subscription_reconciliation:
    class: ScheduleTeamSubscriptionReconciliationJob
    queue: default
    schedule: "35 */6 * * *"
